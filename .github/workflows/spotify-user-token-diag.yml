name: Spotify User-Token Search Diagnostic
on:
  workflow_dispatch:
    inputs:
      refresh_token:
        description: 'Optional Spotify user refresh_token for the user-token diagnostic. The value is masked and never printed to logs. If blank, runs client_credentials control only.'
        required: false
        default: ''

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # The user refresh_token comes from the workflow_dispatch input (the only source —
      # this repo has no refresh-token secret). It is masked and written only to
      # $GITHUB_OUTPUT downstream, never echoed to run logs.
      REFRESH_TOKEN: ${{ github.event.inputs.refresh_token }}
    steps:
      - name: Ensure no token in logs
        run: |
          echo "::add-mask::$REFRESH_TOKEN"
          echo "Using refresh token? $([ -n "$REFRESH_TOKEN" ] && echo yes || echo no)"

      - name: Get client-credentials token (control)
        id: cc
        env:
          ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          # Never echo the token. Write it to GITHUB_OUTPUT only for downstream Bearer use.
          if [ -z "$REFRESH_TOKEN" ] || [ "$REFRESH_TOKEN" = "''" ]; then
            echo "REFRESH_TOKEN empty -> running control only"
          fi
          TOKEN=$(curl -s --max-time 20 -u "${ID}:${SECRET}" \
            -d grant_type=client_credentials \
            https://accounts.spotify.com/api/token | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).access_token||''))")
          [ -n "$TOKEN" ] || { echo "client_credentials TOKEN_EXCHANGE_FAILED"; exit 1; }
          echo "=== client token acquired (not printing) ==="
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Control - search type=playlist via client_credentials
        env:
          TOKEN: ${{ steps.cc.outputs.token }}
        run: |
          echo "== client_credentials search type=playlist 'autumn affection' =="
          curl -s --max-time 30 -w "\nHTTP:%{http_code} TIME:%{time_total}s\n" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.spotify.com/v1/search?type=playlist&limit=8&q=autumn%20affection"

      - name: Exchange refresh_token -> user token (token NOT logged)
        id: user
        if: ${{ env.REFRESH_TOKEN != '' }}
        env:
          REFRESH: ${{ env.REFRESH_TOKEN }}
          ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          echo "== user token exchange (grant_type=refresh_token) =="
          RESP=$(curl -s --max-time 30 \
            -u "${ID}:${SECRET}" \
            -d "grant_type=refresh_token&refresh_token=${REFRESH}" \
            https://accounts.spotify.com/api/token)
          # Parse WITHOUT printing the access token. Log only non-sensitive status/scope.
          printf '%s' "$RESP" | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              let o; try{ o=JSON.parse(d); }catch(e){ console.log('USER_TOKEN_PARSE_FAILED'); process.exit(1); }
              if(o.access_token){ console.log('USER_TOKEN_OK'); console.log('SCOPE='+(o.scope||''));
                // pass token downstream via GITHUB_OUTPUT, never stdout
                const fs=require('fs'); fs.appendFileSync(process.env.GITHUB_OUTPUT,'token='+o.access_token+'\n');
              } else { console.log('USER_TOKEN_EXCHANGE_FAILED:', JSON.stringify(o.error||o)); process.exit(1); }
            });"

      - name: User-token search type=artist (control)
        if: ${{ steps.user.outputs.token != '' }}
        env:
          TOKEN: ${{ steps.user.outputs.token }}
        run: |
          echo "== USER token search type=artist =="
          curl -s --max-time 30 -w "\nHTTP:%{http_code} TIME:%{time_total}s\n" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.spotify.com/v1/search?type=artist&limit=8&q=autumn"

      - name: User-token search type=playlist (the bug target)
        if: ${{ steps.user.outputs.token != '' }}
        env:
          TOKEN: ${{ steps.user.outputs.token }}
        run: |
          echo "== USER token search type=playlist 'autumn affection' =="
          curl -s --max-time 30 -w "\nHTTP:%{http_code} TIME:%{time_total}s\n" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.spotify.com/v1/search?type=playlist&limit=8&q=autumn%20affection"
          echo ""
          echo "== also check an empty-item / malformed query to force empty playlist path =="
          curl -s --max-time 30 -w "\nHTTP:%{http_code} TIME:%{time_total}s\n" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.spotify.com/v1/search?type=playlist&limit=8&q=zzzzzznonexistent"