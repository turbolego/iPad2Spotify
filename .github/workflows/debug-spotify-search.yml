name: Debug Spotify Search

on:
  workflow_dispatch:

jobs:
  test-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Debug Spotify Search
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        shell: bash
        run: |
          set -x
          
          # Get Spotify token
          echo "Getting Spotify token..."
          AUTH=$(printf '%s:%s' "$SPOTIFY_CLIENT_ID" "$SPOTIFY_CLIENT_SECRET" | base64 -w 0)
          TOKEN=$(curl -s -X POST "https://accounts.spotify.com/api/token" \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" | jq -r '.access_token')
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: Failed to get Spotify token"
            exit 1
          fi
          echo "Token acquired: ${TOKEN:0:10}..."
          
          # Test artist search
          echo ""
          echo "=== Artist Search ==="
          ARTIST_URL="https://api.spotify.com/v1/search?type=artist&limit=5&market=NO&q=Billie%20Holiday"
          echo "URL: $ARTIST_URL"
          ARTIST_START=$(date +%s%3N)
          ARTIST_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $TOKEN" "$ARTIST_URL")
          ARTIST_END=$(date +%s%3N)
          ARTIST_ELAPSED=$((ARTIST_END - ARTIST_START))
          ARTIST_STATUS=$(echo "$ARTIST_RESPONSE" | tail -1)
          ARTIST_BODY=$(echo "$ARTIST_RESPONSE" | sed '$d')
          echo "Status: $ARTIST_STATUS"
          echo "Elapsed: ${ARTIST_ELAPSED}ms"
          echo "Body: $ARTIST_BODY" | head -c 500
          
          # Test playlist search
          echo ""
          echo "=== Playlist Search ==="
          PLAYLIST_URL="https://api.spotify.com/v1/search?type=playlist&limit=5&market=NO&q=Nordic%20Hits"
          echo "URL: $PLAYLIST_URL"
          PLAYLIST_START=$(date +%s%3N)
          PLAYLIST_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $TOKEN" "$PLAYLIST_URL")
          PLAYLIST_END=$(date +%s%3N)
          PLAYLIST_ELAPSED=$((PLAYLIST_END - PLAYLIST_START))
          PLAYLIST_STATUS=$(echo "$PLAYLIST_RESPONSE" | tail -1)
          PLAYLIST_BODY=$(echo "$PLAYLIST_RESPONSE" | sed '$d')
          echo "Status: $PLAYLIST_STATUS"
          echo "Elapsed: ${PLAYLIST_ELAPSED}ms"
          echo "Body: $PLAYLIST_BODY" | head -c 500
          
          echo ""
          echo "=== Summary ==="
          echo "Artist: $ARTIST_STATUS in ${ARTIST_ELAPSED}ms"
          echo "Playlist: $PLAYLIST_STATUS in ${PLAYLIST_ELAPSED}ms"
          
          if [ "$ARTIST_STATUS" != "200" ] || [ "$PLAYLIST_STATUS" != "200" ]; then
            echo "FAILED: One or more searches failed"
            exit 1
          fi
          
          echo "SUCCESS: All searches completed"