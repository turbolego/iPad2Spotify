name: Spotify Search Diagnostic
on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get client-credentials token
        id: token
        env:
          ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          TOKEN=$(curl -s --max-time 20 \
            -u "${ID}:${SECRET}" \
            -d grant_type=client_credentials \
            https://accounts.spotify.com/api/token | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).access_token||''))")
          if [ -z "$TOKEN" ]; then echo "TOKEN_EXCHANGE_FAILED"; exit 1; fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Search type=artist (control)
        id: artist
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          echo "--- artist search 'autumn affection' ---"
          curl -s --max-time 30 -w "\nHTTP_STATUS:%{http_code} TIME:%{time_total}s\n" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.spotify.com/v1/search?type=artist&limit=8&q=autumn%20affection"

      - name: Search type=playlist (suspect)
        id: playlist
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          echo "--- playlist search 'autumn affection' ---"
          curl -s --max-time 30 -w "\nHTTP_STATUS:%{http_code} TIME:%{time_total}s\n" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.spotify.com/v1/search?type=playlist&limit=8&q=autumn%20affection"