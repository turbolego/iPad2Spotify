<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Winamp Mode Debug - iPad2Spotify PR #6</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Winamp mode background and layout */
    body.winamp-active {
      background: #3a6ea5 !important;
      margin: 0;
      padding: 0;
    }
    
    .winamp-mode {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    /* Position the main player window */
    #winamp-main {
      position: absolute;
      left: 20px;
      top: 40px;
      width: 275px;
      height: 116px;
      z-index: 10;
    }
    
    /* Position playlist window */
    #winamp-playlist {
      position: absolute;
      left: 310px;
      top: 40px;
      width: 229px;
      height: 242px;
      z-index: 10;
    }
    
    /* Position equalizer window */
    #winamp-eq {
      position: absolute;
      left: 310px;
      top: 300px;
      width: 200px;
      height: 200px;
      z-index: 10;
    }
    
    /* main-contents inside winamp window - 275x116 with 1px padding = 273x114 inner */
    #winamp-main .main-contents {
      width: 273px;
      height: 114px;
      padding: 0 !important;
      overflow: hidden !important;
    }
    
    #winamp-main .main-lcd {
      background: #0a0a12;
      border: 2px inset #161d29;
      padding: 2px;
      margin: 3px;
    }
    
    /* LCD rows */
    #winamp-main .lcd-row1 {
      display: -webkit-flex;
      display: flex;
    }
    
    #winamp-main .lcd-vis {
      width: 58px;
      height: 18px;
      padding: 1px;
      margin-right: 4px;
    }
    
    #winamp-main .winamp-obar {
      display: block;
      height: 2px;
      width: 4px;
      margin: 1px;
      background: #b6d64b;
      opacity: 0.3;
    }
    
    #winamp-main.winamp-playing .winamp-obar {
      opacity: 1;
      animation: bar-bounce 0.5s ease-in-out infinite alternate;
    }
    
    @-webkit-keyframes bar-bounce {
      0% { height: 2px; }
      100% { height: 14px; }
    }
    
    @keyframes bar-bounce {
      0% { height: 2px; }
      100% { height: 14px; }
    }
    
    #winamp-main .lcd-track {
      height: 12px;
      font-family: "Courier New", monospace;
      font-size: 10px;
      color: #b6d64b;
      overflow: hidden;
    }
    
    #winamp-main .lcd-track-text {
      display: block;
      white-space: nowrap;
      overflow: hidden;
    }
    
    #winamp-main .lcd-track-text.marquee {
      animation: marquee-scroll 8s linear infinite;
    }
    
    @-webkit-keyframes marquee-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    
    @keyframes marquee-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    
    /* LCD row 2: time, kbps, khz, mono/stereo */
    #winamp-main .lcd-row2 {
      display: -webkit-flex;
      display: flex;
      margin-top: 2px;
    }
    
    #winamp-main .lcd-readout {
      font-family: "Courier New", monospace;
      font-size: 9px;
      color: #b6d64b;
      margin-right: 8px;
    }
    
    #winamp-main .lcd-readout b {
      color: #b6d64b;
    }
    
    #winamp-main .lcd-chan {
      display: -webkit-flex;
      display: flex;
      font-family: "Courier New", monospace;
      font-size: 8px;
      color: #888;
    }
    
    #winamp-main .lcd-chan b {
      margin-right: 2px;
    }
    
    #winamp-main .lcd-mono {
      color: #888;
    }
    
    #winamp-main .lcd-stereo {
      color: #b6d64b;
    }
    
    /* LCD row 3: volume, balance, EQ/PL toggles */
    #winamp-main .lcd-row3 {
      margin-top: 2px;
      display: -webkit-flex;
      display: flex;
      align-items: center;
    }
    
    #winamp-main .slider-label {
      font-family: "Courier New", monospace;
      font-size: 8px;
      color: #888;
      margin-right: 2px;
      width: 20px;
    }
    
    #winamp-main .bal-label {
      margin-left: 8px;
    }
    
    /* Horizontal bar sliders */
    #winamp-main .hbar {
      position: relative;
      height: 6px;
      width: 68px;
      background: #202224;
      border: 1px inset #4a4d4e;
      cursor: pointer;
    }
    
    #winamp-main .hbar-sm {
      width: 38px;
    }
    
    #winamp-main .hbar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: #b6d64b;
      width: 75%;
    }
    
    #winamp-main .hbar-knob {
      position: absolute;
      top: -2px;
      width: 10px;
      height: 10px;
      background: #b6d64b;
      border: 1px solid #4a5c25;
      border-radius: 0;
      left: 75%;
      margin-left: -5px;
    }
    
    /* LCD progress bar */
    #winamp-main .lcd-progress {
      height: 3px;
      margin-top: 2px;
      background: #161d29;
      border: 1px inset #0a0a12;
    }
    
    #winamp-main .lcd-progress-fill {
      height: 100%;
      background: #b6d64b;
      width: 0%;
    }
    
    #winamp-main .lcd-progress-knob {
      position: absolute;
      top: -2px;
      width: 8px;
      height: 5px;
      background: #b6d64b;
      border: 1px solid #4a5c25;
      left: 0%;
      margin-left: -4px;
    }
    
    /* EQ/PL toggle mini buttons */
    #winamp-main .mini-toggle {
      font-size: 7px;
      padding: 1px 4px;
      background: #202224;
      background: linear-gradient(to bottom, #3a3f3a, #1a1c1d);
      border: 1px outset #4a4d4e;
      color: #888;
      cursor: pointer;
      margin-left: 4px;
    }
    
    #winamp-main .mini-toggle:active {
      background: #444;
      border-style: inset;
    }
    
    #winamp-main .mini-toggle.winamp-btn-active {
      background: #b6d64b;
      color: #1a1c1d;
      border-color: #b6d64b;
    }
    
    /* Main controls — transport buttons */
    #winamp-main .main-controls {
      margin-top: 1px;
    }
    
    #winamp-main .transport-row {
      margin-bottom: 1px;
    }
    
    #winamp-main .transport-row .winamp-btn {
      width: 23px;
      height: 17px;
      font-size: 9px;
      background: #3a4a5c;
      background: linear-gradient(to bottom, #55657a, #2a3a4c);
      border: 1px outset #8090a5;
      cursor: pointer;
      line-height: 17px;
      text-align: center;
      color: #f5f1e8;
      font-family: "Courier New", monospace;
      box-shadow: inset 1px 1px 0 #8090a5, inset -1px -1px 0 #182132;
    }
    
    #winamp-main .transport-row .winamp-btn:active {
      border-style: inset;
      background: #1a2530;
    }
    
    #winamp-main .transport-row .winamp-play {
      color: #b6d64b;
    }
    
    #winamp-main .transport-row .winamp-pause {
      color: #b6d64b;
    }
    
    #winamp-main .transport-row .winamp-stop {
      color: #b6d64b;
    }
    
    /* Secondary row (shuffle/repeat) */
    #winamp-main .secondary-row {
      display: -webkit-flex;
      display: flex;
      align-items: center;
    }
    
    #winamp-main .secondary-row .winamp-btn {
      width: 36px;
      height: 17px;
      font-size: 7px;
      background: #3a4a5c;
      background: linear-gradient(to bottom, #55657a, #2a3a4c);
      border: 1px outset #8090a5;
      cursor: pointer;
      line-height: 17px;
      text-align: center;
      color: #888;
      font-family: "Courier New", monospace;
      box-shadow: inset 1px 1px 0 #8090a5, inset -1px -1px 0 #182132;
    }
    
    #winamp-main .secondary-row .winamp-btn:active {
      border-style: inset;
      background: #1a2530;
    }
    
    #winamp-main .secondary-row .winamp-btn.winamp-btn-active {
      background: #b6d64b;
      color: #1a1c1d;
      border-color: #b6d64b;
    }
    
    #winamp-main .clutch-icon {
      width: 15px;
      height: 15px;
      margin-left: auto;
    }
    
    /* Window drag handles */
    .wmodule {
      position: absolute;
      cursor: default;
      image-rendering: -moz-crisp-edges;
      image-rendering: -o-crisp-edges;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
      -ms-interpolation-mode: nearest-neighbor;
    }
    
    /* Make modules visible for debug */
    .wmodule {
      position: absolute !important;
    }
    
    /* Show the winamp player section */
    .winamp-player {
      display: block !important;
      visibility: visible !important;
    }
    
  </style>
</head>
<body class="winamp-active">
  <div class="winamp-mode">
    <section id="winamp-player" class="winamp" aria-label="Winamp mode player">
      <div id="winamp-mover" class="winamp-mover">
        <div id="winamp-main" class="wmodule main" data-mod="main" style="left:20px;top:40px">
          <div class="wtitle">
            <span class="wtitle-icon" aria-hidden="true"></span>
            <span class="wtitle-accent" aria-hidden="true"></span>
            <span class="wtitle-text">WINAMP</span>
            <span class="wtitle-accent" aria-hidden="true"></span>
            <span class="wtitle-btns"><button class="wbtn-min" data-mod="main" aria-label="Shade"></button><button class="wbtn-close" data-mod="main" aria-label="Close window"></button></span>
          </div>
          <div class="wcontents main-contents">
            <div class="main-lcd">
              <div class="lcd-row1">
                <div class="lcd-vis" id="winamp-osc" aria-hidden="true">
                  <span class="winamp-obar winamp-o1"></span><span class="winamp-obar winamp-o2"></span><span class="winamp-obar winamp-o3"></span><span class="winamp-obar winamp-o4"></span><span class="winamp-obar winamp-o5"></span><span class="winamp-obar winamp-o6"></span><span class="winamp-obar winamp-o7"></span><span class="winamp-obar winamp-o8"></span><span class="winamp-obar winamp-o9"></span><span class="winamp-obar winamp-o10"></span><span class="winamp-obar winamp-o11"></span><span class="winamp-obar winamp-o12"></span><span class="winamp-obar winamp-o13"></span><span class="winamp-obar winamp-o14"></span><span class="winamp-obar winamp-o15"></span><span class="winamp-obar winamp-o16"></span>
                </div>
                <div class="lcd-track"><span id="winamp-track" class="lcd-track-text">*** Nothing playing ***</span></div>
              </div>
              <div class="lcd-row2">
                <span class="lcd-readout"><b id="winamp-elapsed">0:00</b>/<b id="winamp-duration">0:00</b></span>
                <span class="lcd-readout winamp-kbps" id="winamp-kbps">128</span>
                <span class="lcd-readout winamp-khz" id="winamp-khz">44.1</span>
                <span class="lcd-chan lcd-mono" id="winamp-mono">M</span>
                <span class="lcd-chan lcd-stereo" id="winamp-stereo">S</span>
              </div>
              <div class="lcd-row3">
                <div class="hbar"></div>
                <div class="lcd-progress"><div id="winamp-fill" class="lcd-progress-fill"></div><div
                  class="lcd-progress-knob"></div></div>
              </div>
            </div>
            <div class="main-controls">
              <div class="secondary-row">
                <button id="winamp-shuffle" class="winamp-btn winamp-shuffle" aria-label="Shuffle">SHUFFLE</button>
                <button id="winamp-repeat" class="winamp-btn winamp-repeat" aria-label="Repeat">&#8635;</button>
                <span class="clutch-icon" aria-hidden="true"></span>
              </div>
              <div class="transport-row">
                <button id="winamp-prev" class="winamp-btn winamp-prev" aria-label="Previous track"></button>
                <button id="winamp-play" class="winamp-btn winamp-play" aria-label="Play"></button>
                <button id="winamp-pause" class="winamp-btn winamp-pause" aria-label="Pause"></button>
                <button id="winamp-stop" class="winamp-btn winamp-stop" aria-label="Stop"></button>
                <button id="winamp-next" class="winamp-btn winamp-next" aria-label="Next track"></button>
                <button id="winamp-eject" class="winamp-btn winamp-eject" aria-label="Eject"></button>
              </div>
            </div>
          </div>
        </div>
        
        <!-- PLAYLIST window -->
        <div id="winamp-playlist" class="wmodule playlist" data-mod="playlist" style="left:310px;top:40px">
          <div class="wtitle">
            <span class="wtitle-icon" aria-hidden="true"></span>
            <span class="wtitle-accent" aria-hidden="true"></span>
            <span class="wtitle-text">LIST</span>
            <span class="wtitle-accent" aria-hidden="true"></span>
            <span class="wtitle-btns"><button class="wbtn-min" data-mod="playlist" aria-label="Shade"></button><button class="wbtn-close" data-mod="playlist" aria-label="Close window"></button></span>
          </div>
          <div class="wcontents">
            <div class="playlist-top">
              <div class="playlist-top-left"><span class="winamp-obar winamp-o1" style="height:10px;margin:0"></span></div>
              <div class="playlist-top-left-spacer"></div>
              <div class="playlist-top-left-fill"></div>
              <div class="playlist-top-title">Winamp</div>
              <div class="playlist-top-right-spacer"></div>
              <div class="playlist-top-right-fill"></div>
              <div class="playlist-top-right"></div>
            </div>
            <div class="playlist-middle">
              <div class="playlist-middle-left"></div>
              <div class="playlist-middle-center">
                <div class="playlist-header">
                  <div class="ph-col1">#</div>
                  <div class="ph-col2">Title</div>
                  <div class="ph-col3">Artist</div>
                  <div class="ph-col4">Album</div>
                  <div class="ph-col5">Length</div>
                </div>
                <div class="playlist-tracks" id="winamp-playlist-tracks">
                  <!-- Tracks loaded here -->
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <!-- EQUALIZER window -->
        <div id="winamp-eq" class="wmodule eq" data-mod="eq" style="left:310px;top:300px">
          <div class="wtitle">
            <span class="wtitle-icon" aria-hidden="true"></span>
            <span class="wtitle-accent" aria-hidden="true"></span>
            <span class="wtitle-text">EQ</span>
            <span class="wtitle-accent" aria-hidden="true"></span>
            <span class="wtitle-btns"><button class="wbtn-min" data-mod="eq" aria-label="Shade"></button><button class="wbtn-close" data-mod="eq" aria-label="Close window"></button></span>
          </div>
          <div class="wcontents">
            <div class="eq-main">
              <div class="eq-preset">
                <button class="winamp-btn winamp-shuffle">PRESET</button>
                <button class="winamp-btn winamp-repeat">31</button>
              </div>
              <div class="eq-sliders">
                <div class="eq-slider-group">
                  <span class="eq-slider-label">60</span>
                  <div class="hbar-sm"><div class="hbar-fill" style="width:50%"></div><div class="hbar-knob" style="left:50%;margin-left:-5px"></div></div>
                  <span class="eq-slider-val">12dB</span>
                </div>
                <div class="eq-slider-group">
                  <span class="eq-slider-label">170</span>
                  <div class="hbar-sm"><div class="hbar-fill" style="width:50%"></div><div class="hbar-knob" style="left:50%;margin-left:-5px"></div></div>
                  <span class="eq-slider-val">12dB</span>
                </div>
                <div class="eq-slider-group">
                  <span class="eq-slider-label">310</span>
                  <div class="hbar-sm"><div class="hbar-fill" style="width:50%"></div><div class="hbar-knob" style="left:50%;margin-left:-5px"></div></div>
                  <span class="eq-slider-val">12dB</span>
                </div>
                <div class="eq-slider-group">
                  <span class="eq-slider-label">600</span>
                  <div class="hbar-sm"><div class="hbar-fill" style="width:50%"></div><div class="hbar-knob" style="left:50%;margin-left:-5px"></div></div>
                  <span class="eq-slider-val">12dB</span>
                </div>
                <div class="eq-slider-group">
                  <span class="eq-slider-label">1k</span>
                  <div class="hbar-sm"><div class="hbar-fill" style="width:50%"></div><div class="hbar-knob" style="left:50%;margin-left:-5px"></div></div>
                  <span class="eq-slider-val">12dB</span>
                </div>
                <div class="eq-slider-group">
                  <span class="eq-slider-label">3k</span>
                  <div class="hbar-sm"><div class="hbar-fill" style="width:50%"></div><div class="hbar-knob" style="left:50%;margin-left:-5px"></div></div>
                  <span class="eq-slider-val">12dB</span>
                </div>
                <div class="eq-slider-group">
                  <span class="eq-slider-label">6k</span>
                  <div class="hbar-sm"><div class="hbar-fill" style="width:50%"></div><div class="hbar-knob" style="left:50%;margin-left:-5px"></div></div>
                  <span class="eq-slider-val">12dB</span>
                </div>
                <div class="eq-slider-group">
                  <span class="eq-slider-label">12k</span>
                  <div class="hbar-sm"><div class="hbar-fill" style="width:50%"></div><div class="hbar-knob" style="left:50%;margin-left:-5px"></div></div>
                  <span class="eq-slider-val">12dB</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  
  <!-- Winamp mode state -->
  <input type="hidden" id="winamp-mode" value="on">
</body>
</html>
